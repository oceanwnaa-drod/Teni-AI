<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teni AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 70'%3E%3Cellipse cx='24' cy='62' rx='10' ry='7' fill='%238fcf7a'/%3E%3Cellipse cx='60' cy='62' rx='10' ry='7' fill='%238fcf7a'/%3E%3Cpath d='M4 58Q4 12 42 12Q80 12 80 58Z' fill='%23e8a54b' stroke='%239a5a1c' stroke-width='4'/%3E%3Cpath d='M26 28H58L66 44L42 54L18 44Z' fill='%23ffd98f' stroke='%239a5a1c' stroke-width='3'/%3E%3Ccircle cx='85' cy='42' r='13' fill='%238fcf7a' stroke='%233f8f3a' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{--ink:#3b4a33;--mute:#7a8b6f;--g1:#8cc65a;--g2:#62a83f;--or1:#fbd488;--or2:#f2b556;--card:rgba(255,255,250,.88)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);background:#e7f1d3;min-height:100vh;padding:14px}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;color:var(--ink)}
.shell{position:relative;display:grid;grid-template-columns:116px 1fr;max-width:1340px;min-height:calc(100vh - 28px);margin:auto;border-radius:34px;border:2px solid #dce6c3;background:linear-gradient(180deg,#e3f0cf 0,#f6f8e3 15%,#fbf9ea 50%,#f2f6db 100%);box-shadow:0 18px 50px rgba(90,130,60,.18);overflow:hidden}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:90px;z-index:0;pointer-events:none}
.cloud{position:absolute;width:110px;height:32px;background:#fff;border-radius:30px;opacity:.85;z-index:0;pointer-events:none;animation:drift 8s ease-in-out infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:48px;height:48px;top:-24px;left:16px}.cloud::after{width:36px;height:36px;top:-16px;left:58px}
@keyframes drift{50%{transform:translate(12px,-8px)}}
/* trang trí */
.fl{position:absolute;z-index:0;pointer-events:none;transform-origin:50% 100%;animation:sway 3.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.lf{position:absolute;z-index:0;pointer-events:none;width:26px;height:26px;border-radius:0 100% 0 100%;background:#7cc06a;opacity:.55;top:-40px;animation:fall 17s linear infinite}
@keyframes fall{0%{transform:translate(0,-5%) rotate(0)}50%{transform:translate(40px,50vh) rotate(200deg)}100%{transform:translate(-20px,105vh) rotate(380deg)}}
.tw{position:absolute;z-index:0;pointer-events:none;color:#f3c14a;animation:tw 2.8s ease-in-out infinite;line-height:1}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.dec{position:absolute;z-index:0;pointer-events:none}
/* sidebar */
.side{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px 0;background:linear-gradient(180deg,rgba(212,235,188,.8),rgba(236,245,213,.55));border-right:2px solid #dbe6c0;border-radius:0 46px 46px 0;overflow:hidden}
.nv{width:94px;border:2px solid transparent;background:none;color:#5d7a4d;border-radius:22px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:13px;line-height:1.15;text-align:center}
.nv svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nv.on{background:linear-gradient(180deg,#e3f3d0,#d3ebbb);border-color:#c3dfa8;color:#3f7a2c;box-shadow:0 4px 10px rgba(110,160,70,.2)}
.nv:hover:not(.on){background:rgba(255,255,255,.55)}
.mas{margin-top:auto;width:112px;margin-left:-2px;margin-bottom:6px;height:auto;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
/* main */
.main{position:relative;z-index:1;padding:18px 28px 100px;min-width:0}
.top{display:flex;align-items:center;gap:18px}
.search{position:relative;flex:1;max-width:760px;margin:0 auto}
.search input{width:100%;height:52px;border-radius:30px;border:2px solid #dbe3c4;background:rgba(255,255,255,.78);padding:0 52px 0 54px;font:600 16px "Nunito","Segoe UI",system-ui,sans-serif;outline:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.03)}
.search input:focus{border-color:#a9d27f}
.search .ic{position:absolute;left:18px;top:13px;width:26px;height:26px;stroke:#7b8a6d;fill:none;stroke-width:2;stroke-linecap:round}
.search .sp{position:absolute;right:18px;top:11px;color:#f3b744;font-size:24px}
.res{position:absolute;top:58px;left:0;right:0;background:#fffff7;border:2px solid #dbe3c4;border-radius:20px;box-shadow:0 14px 30px rgba(80,110,50,.18);padding:6px;z-index:30;display:none}
.res.show{display:block}
.res button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:10px 12px;border-radius:14px;font:600 14px "Nunito","Segoe UI",sans-serif}
.res button:hover{background:#eef6df}
.res small{color:var(--mute);margin-left:auto}
.res .none{padding:12px;color:var(--mute);font-weight:600}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:30px;color:#3f7a2c;letter-spacing:-.5px;white-space:nowrap}
.brand svg{width:54px;height:38px}
/* generic */
.card{position:relative;background:var(--card);border:2px solid #ecebd0;border-radius:30px;box-shadow:0 10px 26px rgba(120,140,70,.12)}
h2.t{margin:22px 0 4px;font-size:26px}
.sub{color:var(--mute);font-weight:600;margin:0 0 14px}
.pbtn{border:0;border-radius:18px;padding:14px 34px;font-weight:800;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:10px;color:#fff;background:linear-gradient(180deg,var(--g1),var(--g2));box-shadow:0 6px 14px rgba(90,150,50,.3)}
.pbtn:hover{filter:brightness(1.05)}
.pbtn.or{background:linear-gradient(180deg,var(--or1),var(--or2));color:#8a5410;box-shadow:0 6px 14px rgba(230,160,60,.3)}
.pbtn.soft{background:#eef5da;color:#4f8a35;box-shadow:none;border:2px solid #d6e7b9}
.pbtn.sm{padding:10px 22px;font-size:15px;border-radius:16px}
.pbtn.red{background:linear-gradient(180deg,#f0907f,#da6a58);box-shadow:0 6px 14px rgba(210,90,70,.25)}
.link{background:none;border:0;color:#4f8a35;font-weight:800;font-size:15px;padding:6px 0;margin-top:14px}
/* home */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:20px}
.big{padding:22px 22px 26px;min-height:350px;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.big::before{content:"";position:absolute;left:0;right:0;top:0;height:80px;opacity:.6}
.big.g::before{background:linear-gradient(180deg,#cfe6b8,transparent)}
.big.o{background:linear-gradient(180deg,#fff3df,#fffaf0)}
.big.o::before{background:linear-gradient(180deg,#fbe0b4,transparent)}
.big .ill{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.big .ill svg{width:190px;height:auto;filter:drop-shadow(0 8px 8px rgba(0,0,0,.1))}
.big h3{margin:0 0 2px;font-size:22px;position:relative}
.big p{margin:0 0 16px;color:var(--mute);font-weight:600;text-align:center;position:relative}
.big .pbtn{position:relative}
.info{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:20px}
.ib{padding:16px 22px;display:flex;gap:14px;align-items:center}
.ib .ico{font-size:34px;line-height:1}
.ib b{display:block;font-size:17px}
.ib .d{margin-left:auto;color:var(--mute);font-weight:700;font-size:14px;white-space:nowrap}
.ib p{margin:4px 0 0;color:#5f6f55;font-weight:600;font-size:14.5px;line-height:1.4}
/* learn */
.tabs{display:flex;gap:12px;margin:18px 0 18px;flex-wrap:wrap}
.tb{display:flex;align-items:center;gap:10px;padding:12px 24px;border-radius:30px;border:2px solid #e3e5c9;background:rgba(255,255,255,.55);color:#6c7c5f;font-weight:800;font-size:16px}
.tb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb.on{background:linear-gradient(180deg,#86c156,#68a843);color:#fff;border-color:#68a843;box-shadow:0 5px 12px rgba(90,150,50,.3)}
.secT{display:flex;align-items:baseline;gap:10px;margin:4px 4px 12px}
.secT b{font-size:20px}.secT span{color:var(--mute);font-weight:600;font-size:14px}
.subs{display:grid;grid-template-columns:repeat(8,1fr);gap:12px;margin-bottom:22px}
.st{border:2px solid transparent;border-radius:22px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:15px;transition:transform .15s}
.st:hover{transform:translateY(-3px)}
.st .c{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.08)}
.st .c svg{width:30px;height:30px;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.st small{font-weight:700;color:#6c7c5f;font-size:12px}
.bar{width:100%;height:7px;border-radius:9px;background:rgba(0,0,0,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.fc{padding:20px 24px;display:flex;gap:22px;align-items:center;min-height:210px}
.fc .ill{width:170px;flex:none;display:flex;justify-content:center}
.fc .ill svg{width:150px;height:auto;filter:drop-shadow(0 6px 6px rgba(0,0,0,.1))}
.fc .bd{flex:1;min-width:0}
.fc h3{margin:0 0 6px;font-size:22px}
.fc p{margin:0 0 12px;color:#5f6f55;font-weight:600;line-height:1.45}
.kw{display:flex;align-items:center;background:#fff;border:2px solid #e3e8cd;border-radius:30px;padding:4px 4px 4px 18px;gap:8px}
.kw input{flex:1;min-width:0;border:0;outline:none;font:600 15px "Nunito","Segoe UI",sans-serif;background:none}
.kw button{width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(180deg,var(--g1),var(--g2));display:flex;align-items:center;justify-content:center}
.kw button svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round}
.rowc{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sel{border:2px solid #e3e8cd;background:#fff;border-radius:26px;padding:11px 18px;font:700 15px "Nunito","Segoe UI",sans-serif;outline:none}
.more{margin-top:20px;padding:16px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.more .ico{font-size:34px}
.more b{display:block;font-size:19px}.more small{color:var(--mute);font-weight:600}
.chip{border:2px solid #e3e8cd;background:#fffdf3;border-radius:26px;padding:11px 20px;font-weight:800;font-size:15px;display:inline-flex;gap:8px;align-items:center}
.chip:hover{background:#f1f7df}
.motto{margin-left:auto;font-weight:800;color:#4f8a35;font-size:19px;text-align:center;line-height:1.3;background:#f1f7df;border:2px solid #dcebc0;border-radius:20px;padding:8px 18px}
/* subject page */
.back{border:0;background:none;color:#4f8a35;font-weight:800;font-size:16px;padding:6px 0;margin-top:14px}
.shead{display:flex;align-items:center;gap:20px;padding:22px 28px;margin-top:10px}
.shead .c{width:84px;height:84px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 12px rgba(0,0,0,.1)}
.shead .c svg{width:46px;height:46px;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.shead h2{margin:0;font-size:30px}
.shead p{margin:4px 0 0;font-weight:700;color:#5f6f55}
.ring{margin-left:auto;width:92px;height:92px;position:relative}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-top:20px}
.panel{padding:20px 24px}
.panel h3{margin:0 0 12px;font-size:20px}
.ls{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2px solid #ecebd0;background:#fffdf5;border-radius:18px;padding:13px 16px;font-weight:700;font-size:16px;margin-bottom:10px}
.ls:hover{background:#f3f8e4}
.ls .ck{width:28px;height:28px;border-radius:9px;border:3px solid #c5d6a8;display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
.ls.on{background:#eef7dc;border-color:#cfe5ad}
.ls.on .ck{background:#6fb348;border-color:#6fb348}
.ls.on .ck::after{content:"✓";color:#fff;font-weight:900;font-size:17px}
.ls.on span{text-decoration:line-through;text-decoration-color:#9bb97d;color:#6c7c5f}
textarea.nt{width:100%;min-height:210px;border:2px solid #e3e8cd;background:#fffef6;border-radius:18px;padding:14px;font:600 15px/1.5 "Nunito","Segoe UI",sans-serif;resize:vertical;outline:none}
/* timetable */
.tt{display:grid;grid-template-columns:70px repeat(6,1fr);gap:8px;padding:18px;overflow-x:auto;min-width:0}
.tt .h{text-align:center;font-weight:800;padding:8px 0;color:#4f8a35}
.tt .p{display:flex;align-items:center;justify-content:center;font-weight:800;color:#7a8b6f;font-size:13px}
.tt button.cell{min-height:58px;min-width:76px;border-radius:16px;border:2px dashed #dfe5c8;background:rgba(255,255,255,.6);font-weight:800;font-size:14px;padding:4px}
.tt button.cell:hover{border-color:#b9d98f}
.tt button.cell.f{border-style:solid;border-color:transparent}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
/* plan */
.wk{padding:18px 22px;margin-bottom:16px}
.wk h3{margin:0 0 10px;font-size:19px}
.dy{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px dashed #e3e6cb;font-weight:700}
.dy:first-of-type{border-top:0}
.dy .dn{width:74px;color:#4f8a35;font-weight:800;flex:none}
.tag{border-radius:14px;padding:4px 12px;font-weight:800;font-size:14px;flex:none}
/* stats */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}
.sum .card{padding:16px 20px}
.sum small{color:var(--mute);font-weight:700;display:block}
.sum b{font-size:26px}
.hb{display:flex;align-items:center;gap:14px;margin:12px 0;font-weight:800}
.hb .n{width:92px}
.hb .bar{height:16px;flex:1}
.hb .v{width:70px;text-align:right;color:#5f6f55;font-size:14px}
/* misc */
.ov{position:fixed;inset:0;background:rgba(40,60,30,.4);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.ov.show{display:flex}
.pn{position:relative;width:100%;max-width:460px;max-height:88vh;overflow:auto;background:#fffff6;border:2px solid #e3e8cd;border-radius:28px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.pn h3{margin:0 0 10px;font-size:22px}
.pn .x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;border:0;background:#eef3dc;font-size:15px}
.pn ul{padding-left:20px;line-height:1.7;font-weight:600}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pk button{border:2px solid transparent;border-radius:16px;padding:12px;font-weight:800;font-size:15px;display:flex;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#3f6f2c;color:#fff;padding:12px 22px;border-radius:24px;font-weight:700;z-index:200;display:none;max-width:90vw;text-align:center}
.toast.show{display:block}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-weight:800;margin-bottom:6px}
.fld input{width:100%;border:2px solid #e3e8cd;background:#fff;border-radius:16px;padding:12px 16px;font:600 16px "Nunito","Segoe UI",sans-serif;outline:none}
.mmw{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;margin-top:16px}
.mmw .card{padding:20px}
.mmb{display:flex;gap:8px;margin-bottom:8px}
.mmb input{flex:1;min-width:0;border:2px solid #e3e8cd;background:#fff;border-radius:14px;padding:10px 14px;font:600 15px "Nunito","Segoe UI",sans-serif;outline:none}
.mmb button{width:40px;border:0;border-radius:12px;background:#f6e4df;font-weight:900;color:#b45544}
.mmg{border-left:6px solid #ccc;border-radius:16px;padding:10px 10px 8px 12px;margin-bottom:12px}
.mmb.sb{margin-left:22px}
.mmadd{border:2px dashed #cfd9b4;background:rgba(255,255,255,.6);border-radius:12px;padding:6px 12px;font-weight:800;font-size:13px;margin:2px 0 0 22px;color:#4f8a35}
.mmv{padding:10px;overflow:auto;max-height:calc(100vh - 28px);position:sticky;top:14px;align-self:start}
.mmv svg{min-width:720px;touch-action:pan-x pan-y}.mmn{cursor:grab;touch-action:none}.mmn.fx{cursor:default}.mmv svg.drag .mmn{cursor:grabbing}.mmv svg.drag{user-select:none}.mmhint{margin:0 0 6px;font-size:13px;color:#7a8c70;font-weight:600}
.bottom{display:none}
/* mobile */
@media (max-width:900px){
 body{padding:0}
 .shell{grid-template-columns:1fr;border-radius:0;border:0;min-height:100vh}
 .side{display:none}
 .main{padding:14px 14px 110px}
 .top{flex-wrap:wrap;gap:10px}
 .brand{order:1;font-size:24px;margin:0 auto 0 0}.brand svg{width:44px;height:32px}
 .search{order:2;flex:1 1 100%;max-width:none}
 .search input{height:46px;font-size:15px}.search .ic{top:10px}.search .sp{top:8px}
 .hero,.info,.fg,.two,.mmw{grid-template-columns:1fr}
 .big{min-height:300px}
 .fc{flex-direction:column;text-align:center;padding:18px}.fc .ill{width:auto}
 .rowc{justify-content:center}
 .subs{grid-template-columns:repeat(4,1fr);gap:8px}
 .st{padding:10px 2px 8px;font-size:13px}.st .c{width:46px;height:46px}.st .c svg{width:25px;height:25px}
 .tabs{gap:8px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}.tb{padding:10px 16px;font-size:14px;white-space:nowrap}
 .motto{display:none}
 .sum{grid-template-columns:1fr}
 .shead{padding:16px;gap:14px;flex-wrap:wrap}.shead .c{width:64px;height:64px}.shead h2{font-size:24px}.ring{width:72px;height:72px}
 .tt{grid-template-columns:44px repeat(6,minmax(60px,1fr));gap:5px;padding:10px}
 .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(246,250,232,.97);border-top:2px solid #d9e5be;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
 .bottom .nv{width:auto;flex:1;padding:6px 2px;font-size:10.5px;border-radius:14px}
 .bottom .nv svg{width:24px;height:24px}
 .hb .n{width:70px}
 .toast{bottom:90px}
}

.exc{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 20px;margin-bottom:12px;max-width:760px}
.exc small{display:block;color:var(--mute);font-weight:700;margin-top:2px}
.exb{font-weight:800;color:var(--mute)}.exb.ok{color:#3b7a2b;background:#dcf0c7;border-radius:14px;padding:6px 12px}
.exr{position:fixed;inset:0;z-index:90;background:linear-gradient(180deg,#eaf6d6,#f7fbe8);overflow:auto}
.exh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#f4fae8;border-bottom:2px solid #dbe5c3;padding:10px 20px;font-weight:800}
.exh b{flex:1;min-width:120px;font-size:18px}.ext{font-size:22px;font-variant-numeric:tabular-nums;color:#3b7a2b}.ext.low{color:#d2553f}.exp{color:var(--mute)}
.exbd{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.exq{padding:16px 20px;margin-bottom:14px}.exq p{font-weight:700;font-size:17px;margin:4px 0 10px}
.eo{display:flex;align-items:center;gap:10px;border:2px solid #e3e8cd;background:#fff;border-radius:14px;padding:10px 14px;margin-bottom:8px;cursor:pointer;font-weight:700}
.eo input{width:20px;height:20px;accent-color:#5fa43d;flex:none}.eo i{font-style:normal;display:inline-block;width:24px;font-weight:900;color:#4f8a35}

/*PX-START*/
var PX={
  LOUD:0.12,
  NAME:{left:'sang trái',right:'sang phải',vert:'cúi hoặc ngẩng đầu',none:'không thấy khuôn mặt',loud:'tiếng ồn'},
  ratio:function(i,a,b){var w=b.x-a.x;return w>0.005?(i.x-a.x)/w:0.5},
  // lm: 478 điểm của MediaPipe Face Landmarker (x, y trong 0..1, ảnh camera không lật gương)
  // Trả về: center | left | right | vert | none. "trái/phải" tính theo chính học sinh.
  classify:function(lm){
    if(!lm||lm.length<468)return 'none';
    var n=lm[1],a=lm[234],b=lm[454],t=lm[10],c=lm[152],w=b.x-a.x;
    if(!(w>0.02))return 'none';
    var r=(n.x-(a.x+b.x)/2)/(w/2);
    if(r>0.38)return 'left';
    if(r<-0.38)return 'right';
    var h=c.y-t.y;
    if(h>0.02){var v=(n.y-t.y)/h;if(v>0.72||v<0.42)return 'vert'}
    if(lm.length>=478){
      var e=(PX.ratio(lm[468],lm[33],lm[133])+PX.ratio(lm[473],lm[362],lm[263]))/2;
      if(e>0.62)return 'left';
      if(e<0.38)return 'right';
    }
    return 'center';
  },
  // Máy trạng thái: cùng một nhãn lệch liên tục từ 10 giây thì báo; quay về giữa dưới 1 giây vẫn tính là liên tục.
  // Nếu vẫn tiếp tục lệch thì nhắc lại mỗi 30 giây.
  step:function(st,label,now,neutral){
    if(label===neutral){
      if(st.cur){if(!st.back)st.back=now;if(now-st.back>=1000){st.cur=null;st.back=0}}
      return null;
    }
    st.back=0;
    if(st.cur!==label){st.cur=label;st.since=now;st.fired=false;st.last=0;return null}
    var d=now-st.since;
    if(!st.fired&&d>=10000){st.fired=true;st.last=now;return {label:label,secs:Math.round(d/1000)}}
    if(st.fired&&now-st.last>=30000){st.last=now;return {label:label,secs:Math.round(d/1000)}}
    return null;
  }
};
/*PX-END*/
var FACE={lm:null,ready:false,
  init:function(){
    var self=this;if(window.TENI_FAKE_FACE){self.ready=true;return Promise.resolve()}
    var base='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35';
    return import(base+'/vision_bundle.mjs').then(function(m){
      return m.FilesetResolver.forVisionTasks(base+'/wasm').then(function(fs){
        function mk(dl){return m.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:dl},runningMode:'VIDEO',numFaces:1})}
        return mk('GPU').catch(function(){return mk('CPU')});
      });
    }).then(function(l){self.lm=l;self.ready=true});
  },
  detect:function(v,t){
    if(window.TENI_FAKE_FACE)return window.TENI_FAKE_FACE(t);
    try{var r=this.lm.detectForVideo(v,t);return r.faceLandmarks&&r.faceLandmarks[0]||null}catch(e){return null}
  }
};

function camReason(e){
  var n=e&&e.name;
  if(n==='NotAllowedError'||n==='SecurityError')return 'Bạn đã chặn quyền camera/mic. Hãy cho phép trong trình duyệt rồi thử lại.';
  if(n==='NotFoundError'||n==='OverconstrainedError')return 'Không tìm thấy camera hoặc mic trên thiết bị.';
  return 'Không bật được camera/mic. Hãy đóng ứng dụng khác đang dùng camera rồi thử lại.';
}
function startExam(id,wantCam){
  var x=exById(id);if(!x||RUN)return;
  var fsReq=false;
  try{var el=document.documentElement;if(el.requestFullscreen){fsReq=true;var pr=el.requestFullscreen();if(pr&&pr.catch)pr.catch(function(){})}}catch(e){}
  closeM();
  var undo=function(){try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}};
  var getMedia=function(){
    if(!wantCam)return Promise.resolve(null);
    var md=navigator.mediaDevices;
    if(!md||!md.getUserMedia)return x.cam?Promise.reject({name:'NotFoundError'}):Promise.resolve(null);
    return md.getUserMedia({video:{width:{ideal:320},height:{ideal:240},facingMode:'user'},audio:true}).catch(function(e){
      if(x.cam)throw e;
      return md.getUserMedia({video:true}).catch(function(){return null});
    });
  };
  getMedia().then(function(media){
    return API('exam.start',{code:SES.code,id:id,cam:media?'agreed':'declined'}).then(function(d){
      if(d.status==='submitted'){if(media)media.getTracks().forEach(function(t){t.stop()});undo();toast('Bạn đã nộp bài này rồi');loadStuExams();return}
      beginRun(d,media,fsReq);
    }).catch(function(e){if(media)media.getTracks().forEach(function(t){t.stop()});throw e});
  }).catch(function(e){undo();toast(e&&e.name&&e.name!=='Error'?camReason(e):(e&&e.message)||'Không bắt đầu được bài kiểm tra')});
}
function beginRun(d,media,fsReq){
  var ex=d.exam,n=ex.questions.length,ans=[];for(var i=0;i<n;i++)ans.push(typeof d.answers[i]==='number'?d.answers[i]:null);
  RUN={id:ex.id,ex:ex,ans:ans,deadline:d.deadline,off:d.now-Date.now(),media:media,fsWanted:false,q:[],sending:false,done:false,hid:0,gz:{},mic:{},faceOk:false,submitting:false,next:0};
  var qs=ex.questions.map(function(q,i){
    return '<div class="card exq"><b>Câu '+(i+1)+'</b><p>'+esc(q.q)+'</p>'+q.o.map(function(o,j){return '<label class="eo"><input type="radio" name="q'+i+'" data-ans="'+i+'-'+j+'"'+(ans[i]===j?' checked':'')+'><span><i>'+'ABCDEF'.charAt(j)+'</i>'+esc(o)+'</span></label>'}).join('')+'</div>';
  }).join('');
  var r=document.createElement('div');r.id='exr';r.className='exr';
  r.innerHTML='<div class="exh"><b>'+esc(ex.title)+'</b><span class="ext" id="ext">--:--</span><span class="exp" id="exp"></span><button class="pbtn sm" data-act="exsubmit">Nộp bài</button></div><div class="exbd" id="exbd">'+qs+'<div style="text-align:center;margin:10px 0 30px"><button class="pbtn" data-act="exsubmit">Nộp bài</button></div></div>'+
   (media?'<div class="exv"><video id="exv" muted playsinline autoplay></video><small id="exn">📷 Đang giám sát</small></div>':'')+
   '<div class="exfs" id="exfs" hidden><div class="card" style="padding:26px;max-width:440px;text-align:center"><h3 style="margin:0 0 8px">Bạn đã thoát toàn màn hình</h3><p class="sub">Giáo viên đã được báo. Hãy quay lại toàn màn hình để tiếp tục làm bài.</p><button class="pbtn" data-act="exfs">Quay lại toàn màn hình</button></div></div>';
  document.body.appendChild(r);
  RUN.fn={vis:onVis,blur:onBlur,foc:onFoc,fs:onFs,bu:function(e){if(RUN&&!RUN.done){e.preventDefault();e.returnValue=''}}};
  document.addEventListener('visibilitychange',RUN.fn.vis);window.addEventListener('blur',RUN.fn.blur);window.addEventListener('focus',RUN.fn.foc);document.addEventListener('fullscreenchange',RUN.fn.fs);window.addEventListener('beforeunload',RUN.fn.bu);
  RUN.timer=setInterval(runTick,500);runTick();updProg();
  if(fsReq)setTimeout(function(){if(RUN&&document.fullscreenElement)RUN.fsWanted=true},800);
  if(media)startProctor();
}
function updProg(){var c=0;RUN.ans.forEach(function(a){if(a!==null)c++});var e=$('#exp');if(e)e.textContent=c+'/'+RUN.ans.length+' câu'}
function runTick(){
  if(!RUN||RUN.done)return;
  var left=RUN.deadline-(Date.now()+RUN.off),e=$('#ext');
  if(e){var s=Math.max(0,Math.ceil(left/1000));e.textContent=p2(Math.floor(s/60))+':'+p2(s%60);e.classList.toggle('low',left<300000)}
  if(left<=0&&!RUN.submitting&&Date.now()>=RUN.next){toast('Hết giờ, đang nộp bài...');submitRun()}
}
function saveAns(){
  if(!RUN||RUN.done)return;clearTimeout(RUN.st);
  RUN.st=setTimeout(function(){if(RUN&&!RUN.done)API('exam.save',{code:SES.code,id:RUN.id,answers:RUN.ans}).catch(function(){})},1200);
}

function grab(){
  try{var v=$('#exv');if(!v||v.readyState<2||!v.videoWidth)return null;var c=document.createElement('canvas');c.width=160;c.height=120;c.getContext('2d').drawImage(v,0,0,160,120);var u=c.toDataURL('image/jpeg',0.5);return u.length<19000?u:null}catch(e){return null}
}
function ev(kind,detail,secs,snap){
  if(!RUN||RUN.done)return;
  RUN.q.push({kind:kind,detail:detail||'',secs:secs||0,snap:snap?grab():null,tries:0});flushQ();
}
function flushQ(){
  if(!RUN||RUN.sending||!RUN.q.length)return;
  var e=RUN.q[0];RUN.sending=true;
  API('exam.event',{code:SES.code,id:RUN.id,kind:e.kind,detail:e.detail,secs:e.secs,snap:e.snap}).then(function(){if(RUN){RUN.q.shift();RUN.sending=false;flushQ()}}).catch(function(){
    if(!RUN)return;RUN.sending=false;e.tries++;if(e.tries>=4)RUN.q.shift();setTimeout(flushQ,4000);
  });
}
function onVis(){
  if(!RUN||RUN.done)return;
  if(document.hidden){RUN.hid=Date.now();ev('tab_hidden','Chuyển tab / ẩn trang',0,true)}
  else if(RUN.hid){var s=Math.round((Date.now()-RUN.hid)/1000);RUN.hid=0;ev('reopen','Quay lại sau '+s+' giây',0,false)}
}
function onBlur(){
  if(!RUN||RUN.done)return;clearTimeout(RUN.bt);
  RUN.bt=setTimeout(function(){if(RUN&&!RUN.done&&!document.hidden&&!document.hasFocus())ev('window_blur','Rời cửa sổ làm bài',0,true)},1500);
}
function onFoc(){if(RUN)clearTimeout(RUN.bt)}
function onFs(){
  if(!RUN||RUN.done)return;var b=$('#exfs');
  if(document.fullscreenElement){RUN.fsWanted=true;if(b)b.hidden=true}
  else if(RUN.fsWanted){ev('fullscreen_exit','Thoát toàn màn hình',0,true);if(b)b.hidden=false}
}
function startProctor(){
  var v=$('#exv');v.srcObject=RUN.media;var pl=v.play();if(pl&&pl.catch)pl.catch(function(){});
  RUN.media.getTracks().forEach(function(t){t.addEventListener('ended',function(){if(RUN&&!RUN.done){ev('cam_lost','Camera hoặc mic bị tắt',0,false);var n=$('#exn');if(n)n.textContent='⚠ Camera/mic đã tắt'}})});
  try{
    var AC=window.AudioContext||window.webkitAudioContext,at=RUN.media.getAudioTracks();
    if(AC&&at.length){RUN.ac=new AC();RUN.an=RUN.ac.createAnalyser();RUN.an.fftSize=1024;RUN.ac.createMediaStreamSource(new MediaStream(at)).connect(RUN.an);RUN.buf=new Float32Array(RUN.an.fftSize);if(RUN.ac.resume)RUN.ac.resume()}
  }catch(e){RUN.an=null}
  FACE.init().then(function(){if(RUN)RUN.faceOk=true}).catch(function(){
    if(!RUN||RUN.done)return;ev('cam_error','Không tải được bộ nhận diện hướng nhìn (camera vẫn chụp ảnh định kỳ)',0,true);
    var n=$('#exn');if(n)n.textContent='📷 Chỉ chụp ảnh (không đo hướng nhìn)';
  });
  RUN.loop=setInterval(proctorTick,200);
  RUN.snapT=setInterval(function(){if(RUN&&!RUN.done){var u=grab();if(u)RUN.q.push({kind:'snap',detail:'',secs:0,snap:u,tries:0}),flushQ()}},60000);
  setTimeout(function(){if(RUN&&!RUN.done){var u=grab();if(u)RUN.q.push({kind:'snap',detail:'',secs:0,snap:u,tries:0}),flushQ()}},4000);
}
function proctorTick(){
  if(!RUN||RUN.done)return;var now=Date.now(),v=$('#exv'),r;
  if(RUN.faceOk&&v&&(v.readyState>=2||window.TENI_FAKE_FACE)){
    r=PX.step(RUN.gz,PX.classify(FACE.detect(v,performance.now())),now,'center');
    if(r)ev(r.label==='none'?'noface':'gaze',PX.NAME[r.label],r.secs,true);
  }
  if(RUN.an){
    RUN.an.getFloatTimeDomainData(RUN.buf);var sum=0;for(var i=0;i<RUN.buf.length;i++)sum+=RUN.buf[i]*RUN.buf[i];
    r=PX.step(RUN.mic,Math.sqrt(sum/RUN.buf.length)>PX.LOUD?'loud':'center',now,'center');
    if(r)ev('noise','Tiếng ồn kéo dài',r.secs,true);
  }
}
function stopRun(){
  if(!RUN)return;var R=RUN;R.done=true;
  clearInterval(R.timer);clearInterval(R.loop);clearInterval(R.snapT);clearTimeout(R.st);clearTimeout(R.bt);
  document.removeEventListener('visibilitychange',R.fn.vis);window.removeEventListener('blur',R.fn.blur);window.removeEventListener('focus',R.fn.foc);document.removeEventListener('fullscreenchange',R.fn.fs);window.removeEventListener('beforeunload',R.fn.bu);
  if(R.media)R.media.getTracks().forEach(function(t){t.stop()});
  try{if(R.ac)R.ac.close()}catch(e){}
  try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}
}
function submitRun(){
  if(!RUN||RUN.submitting)return;RUN.submitting=true;var R=RUN;
  var go=function(){
    API('exam.submit',{code:SES.code,id:R.id,answers:R.ans}).then(function(d){
      stopRun();RUN=null;var box=$('#exr');
      if(box)box.innerHTML='<div class="exfs" style="position:static;min-height:100vh"><div class="card" style="padding:30px;max-width:460px;text-align:center"><div style="font-size:54px">🎉</div><h3 style="margin:6px 0">Đã nộp bài!</h3><p class="sub">Bạn làm đúng <b>'+d.score+'/'+d.total+'</b> câu.</p><button class="pbtn" data-act="exend">Về trang chủ</button></div></div>';
    }).catch(function(e){R.submitting=false;R.next=Date.now()+5000;toast(e.message||'Chưa nộp được, đang thử lại...')});
  };
  var t0=Date.now(),w=setInterval(function(){if(!R.q.length||Date.now()-t0>2500){clearInterval(w);go()}},100);
}

function drawMM(){
  var el=$('#mmsvg');if(!el)return;
  var ct=ST.mm.c.trim()||'Chủ đề',cw=Math.max(130,ct.length*13+44);
  var nodes=[],edges=[];
  ST.mm.pos=ST.mm.pos||{};var POS=ST.mm.pos;
  var mains=[];ST.mm.b.forEach(function(m,i){var subs=[];m.s.forEach(function(x,j){if(x.trim())subs.push({t:x,oj:j})});if(m.t.trim()||subs.length)mains.push({m:m,subs:subs,ci:i%6,oi:i})});
  var n=mains.length,tot=n;mains.forEach(function(o){tot+=o.subs.length});
  var mk0=0;mains.forEach(function(o){mk0=Math.max(mk0,o.subs.length)});var SC=Math.max(1,Math.sqrt(tot/16),mk0/5),W=Math.round(960*SC),H=Math.round(620*SC),cx=W/2,cy=H/2;
  el.setAttribute('viewBox','0 0 '+W+' '+H);el.style.minWidth=Math.round(720*SC)+'px';
  nodes.push({key:'c',x:cx,y:cy,w:cw,h:56,fixed:1,kind:'c',t:ct,fs:23,ci:0});
  function mk(x,y,t,fs,kind,ci,key,pk){return {key:key,pk:pk,x:x,y:y,w:Math.max(64,t.length*fs*0.6+30),h:36,t:t,fs:fs,kind:kind,ci:ci}}

  var wt=0;mains.forEach(function(o){wt+=Math.max(1,o.subs.length)});

  var a0=-Math.PI/2-(WD[0]||0)/2,mi=0,R1x=205*SC,R1y=135*SC,R2x=R1x+135*SC,R2y=R1y+88*SC;

  nodes.forEach(function(p){

    h+='<g class="mmn'+(p.kind==='c'?' fx':'')+'" data-k="'+p.key+'"><rect x="'+(p.x-p.w/2)+'" y="'+(p.y-p.h/2)+'" width="'+p.w+'" height="'+p.h+'" rx="'+(p.h/2)+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'"/><text x="'+p.x+'" y="'+(p.y+(p.kind==='c'?8:5))+'" text-anchor="middle" font-size="'+p.fs+'" font-weight="'+wt+'" fill="#33422c">'+esc(p.t)+'</text></g>';
  });
  if(!n)h+='<text x="480" y="440" text-anchor="middle" font-size="16" fill="#8a9a7f">Thêm nhánh chính để sơ đồ xuất hiện</text>';
  el.innerHTML=h;
  if(!el._mm){el._mm=1;var dr=null;
    function pt(e){var m=el.getScreenCTM();return m?{x:(e.clientX-m.e)/m.a,y:(e.clientY-m.f)/m.d}:{x:0,y:0}}
    el.addEventListener('pointerdown',function(e){var g=e.target.closest&&e.target.closest('.mmn');if(!g||g.classList.contains('fx'))return;
      var k=g.getAttribute('data-k'),P=pt(e),o=ST.mm.pos[k]||[0,0];dr={k:k,sx:P.x,sy:P.y,ox:o[0],oy:o[1]};el.setPointerCapture(e.pointerId);el.classList.add('drag');e.preventDefault()});
    el.addEventListener('pointermove',function(e){if(!dr)return;var P=pt(e);ST.mm.pos[dr.k]=[Math.round(dr.ox+P.x-dr.sx),Math.round(dr.oy+P.y-dr.sy)];drawMM()});
    function end(){if(!dr)return;dr=null;el.classList.remove('drag');save()}
    el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  }
}
function mmPosDel(i,j){var P=ST.mm.pos||{},N={};Object.keys(P).forEach(function(k){var m=/^([ms])(\d+)(?:-(\d+))?$/.exec(k);if(!m)return;var t=m[1],a=+m[2],b=m[3]==null?null:+m[3];
  if(j==null){if(a===i)return;if(a>i)a--}else if(t==='s'&&a===i){if(b===j)return;if(b>j)b--}
  N[t+a+(b==null?'':'-'+b)]=P[k]});ST.mm.pos=N}
/* ---------- shell ---------- */
function renderNav(){
  var h=NAV.map(function(n){return '<button class="nv'+(nav===n[0]?' on':'')+'" data-act="nav" data-v="'+n[0]+'">'+navIco(n[0])+'<span>'+n[1]+'</span></button>'}).join('');
  $('#side').innerHTML=h+TURTLE;
  $('#bottom').innerHTML=h;
}
function render(keepScroll){
  var y=window.scrollY;
  renderNav();
  var v;
  if(mmOpen)v=vMM();
  else if(nav==='home')v=vHome();else if(nav==='exam')v=vExam();else if(nav==='learn')v=cur?vSubject():vLearn();
  else if(nav==='tt')v=vTT();else if(nav==='stats')v=vStats();else v=vSet();
  $('#screen').innerHTML=v;
  if(mmOpen)drawMM();
  window.scrollTo(0,keepScroll?y:0);
}
function go(n){nav=n;cur=null;mmOpen=false;if(n==='learn')tab='kham';render();if(n==='exam')loadStuExams()}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show')},2600)}
function modal(h){$('#pn').innerHTML='<button class="x" data-act="close" aria-label="Đóng">✕</button>'+h;$('#ov').classList.add('show')}
function closeM(){$('#ov').classList.remove('show')}

var MODALS={
 exam:function(){return '<h3>Giám sát thi cử</h3><p style="font-weight:600;line-height:1.55">Hiện chưa có bài kiểm tra nào được giao cho bạn. Khi giáo viên giao bài, nút này sẽ mở bài kiểm tra và bật chế độ giám sát.</p><p style="color:#7a8b6f;font-weight:600;font-size:14px">Tính năng giám sát bằng camera sẽ được bổ sung ở bước sau.</p><button class="pbtn sm" data-act="close">Đã hiểu</button>'},
 docs:function(){return '<h3>📖 Kho tài liệu</h3><p style="font-weight:600">Chưa có tài liệu nào. Tài liệu giáo viên tải lên sẽ hiện theo từng môn:</p><ul>'+SUBJ.map(function(s){return '<li>'+s.name+' — chưa có tài liệu</li>'}).join('')+'</ul>'},
 tips:function(){return '<h3>🏆 Mẹo học hiệu quả</h3><ul><li>Học 25 phút rồi nghỉ 5 phút (phương pháp Pomodoro).</li><li>Tự kiểm tra trước khi xem lại bài, đừng chỉ đọc lại.</li><li>Giải thích bài cho người khác bằng lời của mình.</li><li>Ôn lại theo quãng: sau 1 ngày, 3 ngày, 1 tuần.</li><li>Ngủ đủ giấc để não ghi nhớ kiến thức.</li></ul>'},
 tricks:function(){return '<h3>⭐ Thủ thuật học tập</h3><ul><li>Ghi chú theo cột: ý chính, chi tiết và tóm tắt.</li><li>Vẽ sơ đồ tư duy cho mỗi chương.</li><li>Làm thẻ ghi nhớ cho từ vựng và công thức.</li><li>Gom các bài cùng chủ đề để học một lượt.</li><li>Bắt đầu bằng môn khó khi bạn còn tỉnh táo nhất.</li></ul>'},
 reset:function(){return '<h3>Xóa dữ liệu học tập?</h3><p style="font-weight:600">Tiến độ bài học, ghi chú, thời khóa biểu và sơ đồ tư duy sẽ bị xóa. Việc này không hoàn tác được.</p><div class="rowc"><button class="pbtn sm red" data-act="reset">Xóa dữ liệu</button><button class="pbtn sm soft" data-act="close">Hủy</button></div>'}
};

/* ---------- search ---------- */
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d')}
function search(q){
  q=norm(q.trim());if(!q)return[];var r=[];
  SUBJ.forEach(function(s){if(norm(s.name).indexOf(q)>-1)r.push({id:s.id,t:s.name,k:'Môn học'})});
  SUBJ.forEach(function(s){L(s.id).forEach(function(l){if(norm(l.t).indexOf(q)>-1)r.push({id:s.id,t:l.t,k:s.name})})});
  return r.slice(0,8);
}
function showRes(q){
  var r=search(q),box=$('#res');
  if(!q.trim()){box.classList.remove('show');return}
  box.innerHTML=r.length?r.map(function(x){return '<button data-act="open" data-id="'+x.id+'"><span>'+esc(x.t)+'</span><small>'+esc(x.k)+'</small></button>'}).join(''):'<div class="none">Không tìm thấy kết quả</div>';
  box.classList.add('show');
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!e.target.closest('.search'))$('#res').classList.remove('show');
  if(e.target===$('#ov'))return closeM();
  if(!t)return;
  var a=t.dataset.act,d=t.dataset;
  if(a!=='kw')$('#res').classList.remove('show');
  if(a==='nav'){go(d.v)}
  else if(a==='tab'){if(d.go){nav='learn';cur=null;mmOpen=false}tab=d.v;if(nav!=='learn'){nav='learn';cur=null;mmOpen=false}render()}
  else if(a==='open'){closeM();$('#q').value='';nav='learn';cur=d.id;mmOpen=false;render()}
  else if(a==='tick'){var pp=ST.prog[cur];if(!pp||Array.isArray(pp))pp=ST.prog[cur]={};if(pp[d.id])delete pp[d.id];else pp[d.id]=1;save();render(true)}
  else if(a==='kw'){var v=$('#kw').value;if(!v.trim()){$('#kw').focus();return}$('#q').value=v;showRes(v);window.scrollTo(0,0)}
  else if(a==='plan'){ST.range=+$('#rg').value;save();tab='kehoach';render()}
  else if(a==='mm'){mmOpen=true;render()}
  else if(a==='mmadd'){ST.mm.b.push({t:'',s:[]});save();$('#mb').innerHTML=mmInputs();drawMM();var mi=$('#mb').querySelectorAll('input[data-mm]');mi[mi.length-1].focus()}
  else if(a==='mmdel'){mmPosDel(+d.i);ST.mm.b.splice(+d.i,1);save();$('#mb').innerHTML=mmInputs();drawMM()}
  else if(a==='mmsadd'){var g=ST.mm.b[+d.i];g.s.push('');save();$('#mb').innerHTML=mmInputs();drawMM();var si=$('#mb').querySelectorAll('input[data-ms^="'+d.i+'-"]');si[si.length-1].focus()}
  else if(a==='mmsdel'){mmPosDel(+d.i,+d.j);ST.mm.b[+d.i].s.splice(+d.j,1);save();$('#mb').innerHTML=mmInputs();drawMM()}
  else if(a==='mmsample'){ST.mm={c:'Phân số',b:[{t:'Khái niệm',s:['Tử số','Mẫu số']},{t:'Phép tính',s:['Cộng','Trừ','Nhân','Chia']},{t:'Rút gọn',s:['Ước chung lớn nhất']},{t:'Ứng dụng',s:['Phần trăm','Tỉ lệ']}]};save();render()}
  else if(a==='mmauto'){ST.mm.pos={};save();drawMM()}
  else if(a==='mmclr'){ST.mm={c:'',b:[]};save();render()}
  else if(a==='modal'){modal(MODALS[d.k]())}
  else if(a==='close'){closeM()}
  else if(a==='cell'){var d0=+d.d,p0=+d.p;modal('<h3>'+DAYS[d0]+' · Tiết '+(p0+1)+'</h3><div class="pk">'+SUBJ.map(function(s){return '<button style="background:'+s.bg+';color:'+s.color+'" data-act="ttset" data-d="'+d0+'" data-p="'+p0+'" data-id="'+s.id+'">'+s.name+'</button>'}).join('')+'</div><button class="pbtn sm soft" data-act="ttset" data-d="'+d0+'" data-p="'+p0+'" data-id="">Để trống</button>')}
  else if(a==='ttset'){var k=d.d+'-'+d.p;if(d.id)ST.tt[k]=d.id;else delete ST.tt[k];save();closeM();render(true)}
  else if(a==='ttauto'){for(var di=0;di<6;di++)for(var pi=0;pi<5;pi++)ST.tt[di+'-'+pi]=SUBJ[(di*5+pi)%8].id;save();render(true);toast('Đã tạo thời khóa biểu tự động')}
  else if(a==='ttclear'){ST.tt={};save();render(true)}
  else if(a==='exstart')examConsent(d.id);
  else if(a==='exno'){closeM();toast('Bài này bắt buộc bật camera. Hãy báo giáo viên nếu bạn không thể bật.')}
  else if(a==='exgo')startExam(d.id,d.cam==='1');
  else if(a==='exsubmit'){if(!RUN)return;var c0=0;RUN.ans.forEach(function(v){if(v!==null)c0++});modal('<h3>Nộp bài?</h3><p style="font-weight:600">Bạn đã trả lời '+c0+'/'+RUN.ans.length+' câu.'+(c0<RUN.ans.length?' Còn '+(RUN.ans.length-c0)+' câu chưa làm.':'')+'</p><div class="rowc"><button class="pbtn sm" data-act="exsubmit2">Nộp bài</button><button class="pbtn sm soft" data-act="close">Làm tiếp</button></div>')}
  else if(a==='exsubmit2'){closeM();submitRun()}
  else if(a==='exfs'){try{document.documentElement.requestFullscreen()}catch(x){}}
  else if(a==='exend')exEnd();
  else if(a==='savename'){var nv=$('#nm').value.trim();if(!nv)return toast('Hãy nhập tên');SES.name=nv;try{localStorage.setItem('teni_session',JSON.stringify(SES))}catch(x){}toast('Đã lưu tên')}
  else if(a==='reset'){ST={prog:{},notes:{},tt:{},mm:{c:'',b:[]},range:1};save();closeM();render();toast('Đã xóa dữ liệu học tập')}
  else if(a==='logout'){try{localStorage.removeItem('teni_session')}catch(x){}if(PREVIEW)toast('Đây là bản xem thử, không có trang đăng nhập');else location.href='index.html'}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q')showRes(t.value);
  else if(t.id==='note'){ST.notes[cur]=t.value;save()}
  else if(t.id==='mc'){ST.mm.c=t.value;save();drawMM()}
  else if(t.dataset&&t.dataset.mm!==undefined){ST.mm.b[+t.dataset.mm].t=t.value;save();drawMM()}
  else if(t.dataset&&t.dataset.ms!==undefined){var ij=t.dataset.ms.split('-');ST.mm.b[+ij[0]].s[+ij[1]]=t.value;save();drawMM()}
});
document.addEventListener('change',function(e){var dn=e.target.dataset&&e.target.dataset.ans;if(dn&&RUN){var pr=dn.split('-');RUN.ans[+pr[0]]=+pr[1];updProg();saveAns();return}if(e.target.id==='rg'){ST.range=+e.target.value;save();if(tab==='kehoach')render(true)}});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeM();$('#res').classList.remove('show')}
  if(e.key==='Enter'){if(e.target.id==='q'){var r=search(e.target.value);if(r[0]){closeM();$('#q').value='';nav='learn';cur=r[0].id;mmOpen=false;render()}}else if(e.target.id==='kw'){$('#q').value=e.target.value;showRes(e.target.value)}}
});
if(SERVER){loadStuExams();setInterval(function(){if(nav==='exam'&&!RUN&&!document.hidden)loadStuExams()},30000);LES={};render(true);API('lessons.get',{code:SES.code}).then(function(d){LES=d.lessons;render(true)}).catch(function(e){toast(e.message)});API('notice.list',{code:SES.code}).then(function(d){NEWS=d.notices[0]||null;render(true)}).catch(function(){})}
render();
})();
</script>
